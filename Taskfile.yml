version: "3"

vars:
  ENV_INFRA: ".env.infra"
  COMPOSE_INFRA: "docker-compose.infra.yml"
  ENV_APP: ".env.app"
  COMPOSE_APP: "docker-compose.yml"
  DOCKER_CMD: "docker compose --env-file {{.ENV_INFRA}} --env-file {{.ENV_APP}}"
  KEYCLOAK_THEME_DIR: "./food-delivery-frontend/apps/my-keycloak-theme"
  FRONTEND_DIR: "./food-delivery-frontend"
  BACKEND_DIR: "./food-delivery-backend"

  # 📦 MẢNG DANH SÁCH SERVICES ĐƯỢC CHỈ ĐỊNH ĐÚNG ĐƯỜNG DẪN MODULE MAVEN
  INFRA_SERVICES: [ "keycloak", "kafka", "config-processor", "prometheus", "grafana", "loki", "promtail" ]
  BACKEND_SERVICES: [
    "infra/config-server",
    "infra/eureka-server",
    "infra/api-gateway",
    "services/identity-service",
    "services/delivery-service"
  ]

tasks:
  # ==============================================================================
  # GIAO DIỆN DIỀU KHIỂN TRỰC QUAN (INTERACTIVE MENU)
  # ==============================================================================
  default:
    desc: "🎮 Mở menu tương tác điều khiển hệ thống"
    cmds:
      - "node menu.js"

  # ==============================================================================
  # 1. QUY TRÌNH CHÍNH (MAIN WORKFLOW)
  # ==============================================================================
  dev:
    desc: "🚀 Quy trình khởi động full hệ thống"
    cmds:
      - task: up-infra
      - task: wait-for-infra
      - task: up-backend
      - 'echo "🎉 [SUCCESS] Hệ thống Food Delivery đã sẵn sàng!"'

  down-dev:
    desc: "🛑 Dừng toàn bộ hệ thống và chạy lại"
    cmds:
      - task: down
      - task: dev

  clean-dev:
    desc: "🧹 Xóa sạch dữ liệu cũ và khởi động lại từ đầu"
    cmds:
      - task: clean
      - task: dev

  # ==============================================================================
  # 2. KHỞI ĐỘNG HÀNG LOẠT DÙNG VÒNG LẶP (UP INFRA / BACKEND)
  # ==============================================================================
  up-infra:
    desc: "🐳 Bật toàn bộ hạ tầng nền (Sử dụng vòng lặp)"
    cmds:
      - 'echo "⏳ Đang kích hoạt các hạ tầng..."'
      - for: { var: INFRA_SERVICES }
        cmd: "{{.DOCKER_CMD}} -f {{.COMPOSE_INFRA}} up -d --quiet-pull {{.ITEM}}"

  up-backend:
    desc: "⚙️ Bật toàn bộ Spring Boot Services (Tự động build local các service chỉ định)"
    deps: [ compile ]
    cmds:
      - task: _start-service
        vars: { SERVICE: "config-server", MSG: "Config Server" }
      - task: _start-service
        vars: { SERVICE: "eureka-server", MSG: "Eureka Server" }
      - 'echo "🚀 Khởi động các Core Services còn lại..."'
      - for: { var: BACKEND_SERVICES }
        cmd: |
          {{$srv := .ITEM | base}}
          {{if and (ne $srv "config-server") (ne $srv "eureka-server")}}
            echo "🐳 Đang bật container: {{$srv}}"
            {{$.DOCKER_CMD}} -f {{$.COMPOSE_APP}} up -d --build --quiet-pull {{$srv}}
          {{end}}

  wait-for-infra:
    desc: "🔍 Đợi Keycloak và Kafka sẵn sàng"
    cmds:
      - task: _wait-container
        vars: { NAME: "food-delivery-keycloak", MSG: "Keycloak" }
      - task: _wait-container
        vars: { NAME: "food-delivery-kafka", MSG: "Kafka" }

  compile:
    desc: "☕ Chỉ biên dịch đúng các module trong BACKEND_SERVICES (cross-platform)"
    dir: "{{.BACKEND_DIR}}"
    cmds:
      - 'echo "🛠️ Đang biên dịch siêu tốc các backend services được chỉ định..."'
      - "mvn clean install -pl {{replace \" \" \",\" .BACKEND_SERVICES_STR}} -am -DskipTests -T 1C"
      - 'echo "✅ Biên dịch thành công các service đích!"'
    vars:
      BACKEND_SERVICES_STR: '{{join " " .BACKEND_SERVICES}}'

  # ==============================================================================
  # 3. UTILITIES: HOÀN TOÀN HỖ TRỢ 1 HOẶC NHIỀU SERVICES & CỜ NO-COMPILE
  # ==============================================================================

  # --- NHÓM 1: RECREATE ---
  recreate-infra:
    desc: '🔄 Tái tạo nhanh các service INFRA (Ví dụ: task recreate-infra SERVICE="loki grafana")'
    cmds:
      - "{{.DOCKER_CMD}} -f {{.COMPOSE_INFRA}} up -d --force-recreate --no-deps {{.SERVICE}}"
    requires:
      vars: [ SERVICE ]

  recreate-backend:
    desc: '🔄 Tái tạo nhanh các service BACKEND (Ví dụ: task recreate-backend SERVICE="identity-service api-gateway")'
    cmds:
      - "{{.DOCKER_CMD}} -f {{.COMPOSE_APP}} up -d --force-recreate --no-deps {{.SERVICE}}"
    requires:
      vars: [ SERVICE ]

  # --- NHÓM 2: BUILD DOCKER IMAGE ---
  build-infra:
    desc: '🛠️ Chỉ build lại image cho các service INFRA (Ví dụ: task build-infra SERVICE="keycloak")'
    cmds:
      - "{{.DOCKER_CMD}} -f {{.COMPOSE_INFRA}} build --no-cache {{.SERVICE}}"
    requires:
      vars: [ SERVICE ]

  build-backend:
    desc: '🛠️ Build image cho service BACKEND (Ví dụ: task deploy-backend SERVICE="config-server")'
    cmds:
      - |
        {{if ne .COMPILE "false"}}
        echo "☕ Đang biên dịch Maven cho các service được chọn..."
        
        # 1. Chuẩn hóa đường dẫn module cho Maven (thêm infra/ hoặc services/ nếu chưa có)
        MAVEN_TARGETS=""
        for SRV in {{.SERVICE}}; do
          if [[ "$SRV" != infra/* && "$SRV" != services/* && "$SRV" != shared/* ]]; then
            if [[ "$SRV" == "config-server" || "$SRV" == "eureka-server" || "$SRV" == "api-gateway" ]]; then
              FULL_PATH="infra/$SRV"
            else
              FULL_PATH="services/$SRV"
            fi
          else
            FULL_PATH="$SRV"
          fi
          MAVEN_TARGETS="$MAVEN_TARGETS,$FULL_PATH"
        done
        
        # Xóa dấu phẩy dư ở đầu chuỗi
        MAVEN_TARGETS=${MAVEN_TARGETS#,}
        
        # 2. Chạy lệnh Maven build
        cd {{.BACKEND_DIR}} && mvn clean install -pl $MAVEN_TARGETS -am -DskipTests -T 1C
        {{else}}
        echo "⏭️ [Bỏ qua bước Compile] Tiến hành build thẳng Docker Image từ file .jar có sẵn..."
        {{end}}
      - |
        # 3. Lấy danh sách tên service sạch (không chứa tiền tố) để gọi Docker Compose
        DOCKER_SRVS=""
        for SRV in {{.SERVICE}}; do
          CLEAN_SRV=$(echo "$SRV" | sed 's|.*/||')
          DOCKER_SRVS="$DOCKER_SRVS $CLEAN_SRV"
        done
        
        {{.DOCKER_CMD}} -f {{.COMPOSE_APP}} build --no-cache $DOCKER_SRVS
    vars:
      COMPILE: '{{default "true" .COMPILE}}'
    requires:
      vars: [ SERVICE ]

  # --- NHÓM 3: DEPLOY (BUILD + RECREATE) ---
  deploy-infra:
    desc: '⚡ Build + Recreate các service INFRA (Ví dụ: task deploy-infra SERVICE="prometheus loki")'
    cmds:
      - task: build-infra
        vars: { SERVICE: "{{.SERVICE}}" }
      - task: recreate-infra
        vars: { SERVICE: "{{.SERVICE}}" }
    requires:
      vars: [ SERVICE ]

  deploy-backend:
    desc: '⚡ Compile + Build + Recreate service BACKEND (Ví dụ: task deploy-backend SERVICE="services/identity-service")'
    cmds:
      - task: build-backend
        vars: { SERVICE: "{{.SERVICE}}", COMPILE: "{{.COMPILE}}" }
      - task: recreate-backend
        vars: { SERVICE: "{{.SERVICE}}" }
    vars:
      COMPILE: '{{default "true" .COMPILE}}'
    requires:
      vars: [ SERVICE ]

  # ==============================================================================
  # 4. FRONTEND & KEYCLOAK UTILITIES
  # ==============================================================================
  dev-frontend:
    desc: "💻 Khởi động Frontend Development Server"
    dir: "{{.FRONTEND_DIR}}"
    cmds:
      - "pnpm install"
      - "pnpm dev"

  api-generator:
    desc: "📝 Sinh code client API từ OpenAPI Spec (Swagger) cho Frontend"
    dir: "{{.FRONTEND_DIR}}"
    cmds:
      - "pnpm install"
      - "pnpm run api-generator"

  deploy-theme:
    desc: "🚀 Build và áp dụng theme mới cho container keycloak"
    cmds:
      - task: build-theme
      - task: recreate-infra
        vars: { SERVICE: "keycloak" }
      - task: _wait-container
        vars: { NAME: "food-delivery-keycloak", MSG: "Keycloak" }

  build-theme:
    dir: "{{.KEYCLOAK_THEME_DIR}}"
    cmds:
      - "pnpm install"
      - "pnpm run build-keycloak-theme"

  export-keycloak:
    desc: "🔑 Export cấu hình và users từ realm food-delivery"
    vars:
      CONTAINER_NAME: "food-delivery-keycloak"
      REALM: "food-delivery"
      INSIDE_FILE: "food-delivery-realm.json"
      HOST_IMPORT_PATH: "./development-template/keycloak-realm/realm-export.json"
    cmds:
      - "docker exec -i {{.CONTAINER_NAME}} /opt/keycloak/bin/kc.sh export --optimized --realm {{.REALM}} --file /opt/keycloak/{{.INSIDE_FILE}}"
      - "docker cp {{.CONTAINER_NAME}}:/opt/keycloak/{{.INSIDE_FILE}} {{.HOST_IMPORT_PATH}}"

  # ==============================================================================
  # 5. DOWN & CLEAN
  # ==============================================================================
  down:
    desc: "🛑 Dừng hệ thống"
    cmds:
      - "{{.DOCKER_CMD}} -f {{.COMPOSE_APP}} down"
      - "{{.DOCKER_CMD}} -f {{.COMPOSE_INFRA}} down"

  clean:
    desc: "🚨 XÓA SẠCH HỆ THỐNG (Volume)"
    cmds:
      - "{{.DOCKER_CMD}} -f {{.COMPOSE_APP}} down -v"
      - "{{.DOCKER_CMD}} -f {{.COMPOSE_INFRA}} down -v"

  # ==============================================================================
  # INTERNAL TASKS (HÀM BỔ TRỢ)
  # ==============================================================================
  _wait-container:
    internal: true
    cmds:
      - platforms: [ windows ]
        cmd: powershell -NoProfile -Command "[Console]::OutputEncoding = [System.Text.Encoding]::UTF8; while (!(docker ps --filter 'name={{.NAME}}' --filter 'status=running' | Select-String '{{.NAME}}')) { Write-Host '⏳ Chờ {{.MSG}} khởi động...'; Start-Sleep -Seconds 3 }"
      - platforms: [ darwin, linux ]
        cmd: |
          until docker ps --filter "name={{.NAME}}" --filter "status=running" | grep -q "{{.NAME}}"; do
            echo '⏳ Chờ {{.MSG}} khởi động...'
            sleep 3
          done

  _start-service:
    internal: true
    cmds:
      - "{{.DOCKER_CMD}} -f {{.COMPOSE_APP}} up -d --build --force-recreate {{.SERVICE}} --quiet-pull"
      - platforms: [ windows ]
        cmd: powershell -NoProfile -Command "[Console]::OutputEncoding = [System.Text.Encoding]::UTF8; while (!(docker ps --filter 'name={{.SERVICE}}' --filter 'health=healthy' | Select-String '{{.SERVICE}}')) { Write-Host '   ({{.MSG}} đang khởi tạo...)'; Start-Sleep -Seconds 3 }"
      - platforms: [ darwin, linux ]
        cmd: |
          until docker ps --filter "name={{.SERVICE}}" --filter "health=healthy" | grep -q "{{.SERVICE}}"; do
            echo '   ({{.MSG}} đang khởi tạo...)'
            sleep 3
          done
      - 'echo "✅ {{.MSG}} đã SẴN SÀNG!"'