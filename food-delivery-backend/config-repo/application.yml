eureka:
  client:
    service-url:
      # Tách URL Eureka ra biến EUREKA_SERVER_URL, mặc định là http://localhost:8761/eureka/
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
  instance:
    # Tách tần suất gửi nhịp tim ra biến EUREKA_HEARTBEAT_INTERVAL (giây)
    lease-renewal-interval-in-seconds: ${EUREKA_HEARTBEAT_INTERVAL:5}
    # Tách thời gian chờ nhịp tim tối đa ra biến EUREKA_HEARTBEAT_TIMEOUT (giây)
    lease-expiration-duration-in-seconds: ${EUREKA_HEARTBEAT_TIMEOUT:10}
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        # Tách danh sách cổng hiển thị ra biến ACTUATOR_EXPOSE_ENDPOINTS
        include: ${ACTUATOR_EXPOSE_ENDPOINTS:health,info}
  endpoint:
    health:
      # Tách chế độ hiển thị chi tiết health ra biến ACTUATOR_HEALTH_SHOW_DETAILS (always/never)
      show-details: ${ACTUATOR_HEALTH_SHOW_DETAILS:always}
    env:
      # Tách chế độ hiển thị giá trị cấu hình ra biến ACTUATOR_ENV_SHOW_VALUES (always/never/when_authorized)
      show-values: ${ACTUATOR_ENV_SHOW_VALUES:when_authorized}