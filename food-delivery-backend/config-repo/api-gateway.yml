server:
  port: ${API_GATEWAY_PORT:8080}

springdoc:
  enable-native-support: true
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    # 🌟 CẬP NHẬT CẤU HÌNH GỘP SWAGGER CHO WEBFLUX CHUẨN
    urls:
      - name: Identity Service
        url: /api/v1/auth/v3/api-docs
        displayName: Identity Service API

spring:
  cloud:
    gateway:
      # 🌟 ĐÃ XÓA KHỐI 'server.webflux' -> ĐƯA KHỐI 'routes' RA ĐÂY
      routes:
        # 🌟 ROUTE 1: Điều hướng các API nghiệp vụ thông thường
        - id: identity-service-route
          uri: lb://identity-service
          predicates:
            - Path=/api/v1/auth/**
        
        # 🌟 ROUTE 2: Giúp Gateway tải được file JSON docs từ Service về
        - id: identity-service-openapi-route
          uri: lb://identity-service
          predicates:
            - Path=/api/v1/auth/v3/api-docs
      
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedOrigins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
              - PATCH
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 3600
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_INTERNAL_URL:http://localhost:8180}/realms/${KEYCLOAK_REALM:food-delivery}/protocol/openid-connect/certs
