server:
  port: ${API_GATEWAY_PORT:8080}

springdoc:
  enable-native-support: true
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    urls:
      - name: Identity Service
        url: /api/v1/auth/v3/api-docs
        displayName: Identity Service API

spring:
  # 🌟 THÊM CONFIG KẾT NỐI REDIS (Bắt buộc phải có để chạy Rate Limiter)
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # password: ${REDIS_PASSWORD:} # Mở ra nếu Redis của bạn có mật khẩu

  cloud:
    gateway:
      routes:
        # 🌟 ROUTE 1: Tích hợp Rate Limiter và Retry vào API Nghiệp vụ
        - id: identity-service-route
          uri: lb://identity-service
          predicates:
            - Path=/api/v1/auth/**
          filters:
            # A. Chống Spam / DDoS bằng Rate Limiter
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@userKeyResolver}" # Gọi đến Bean Java xử lý JWT/IP
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                redis-rate-limiter.requestedTokens: 1
            
            # B. Tự động thử lại nếu Identity Service bị lỗi mạng/sập/timeout
            - name: Retry
              args:
                retries: 3
                statuses: BAD_GATEWAY, SERVICE_UNAVAILABLE, GATEWAY_TIMEOUT
                methods: GET, OPTIONS # Chỉ retry các request an toàn
                backoff:
                  firstBackoff: 100ms
                  maxBackoff: 1000ms
                  factor: 2

        # 🌟 ROUTE 2: Giúp Gateway tải được file JSON docs từ Service về (Không cần Rate Limit/Retry)
        - id: identity-service-openapi-route
          uri: lb://identity-service
          predicates:
            - Path=/api/v1/auth/v3/api-docs 
      
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedOrigins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
              - PATCH
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 3600
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_INTERNAL_URL:http://localhost:8180}/realms/${KEYCLOAK_REALM:food-delivery}/protocol/openid-connect/certs