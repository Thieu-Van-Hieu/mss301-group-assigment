version: '3.8'

services:
  # ==========================================
  # 1. KEYCLOAK SERVER
  # ==========================================
  keycloak:
    image: quay.io/keycloak/keycloak:24.0.0
    container_name: food-delivery-keycloak
    command: start-dev --import-realm
    env_file:
      - .env.infra # 🚀 Ép container đọc file .env.infra tại gốc
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN_USER}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HTTP_PORT: ${KEYCLOAK_PORT}
      KC_THEME_CACHE_THEMES: "false"
      KC_THEME_CACHE_TEMPLATES: "false"
    ports:
      - "${KEYCLOAK_PORT}:${KEYCLOAK_PORT}"
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ${KEYCLOAK_THEME_PATH}/keycloak-theme-for-kc-22-to-25.jar:/opt/keycloak/providers/my-theme.jar
      - ./development-template/keycloak-realm/realm-export.json:/opt/keycloak/data/import/realm-export.json
    networks:
      - food-delivery-network

  # ==========================================
  # 2. KAFKA BROKER (Chuẩn KRaft)
  # ==========================================
  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: food-delivery-kafka
    env_file:
      - .env.infra # 🚀 Ép container đọc file .env.infra tại gốc
    ports:
      - "${KAFKA_PORT_EXTERNAL}:${KAFKA_PORT_EXTERNAL}"
    environment:
      KAFKA_NODE_ID: ${KAFKA_NODE_ID}
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '${KAFKA_NODE_ID}@kafka:${KAFKA_PORT_CONTROLLER}'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:${KAFKA_PORT_EXTERNAL},CONTROLLER://0.0.0.0:${KAFKA_PORT_CONTROLLER},PLAINTEXT_HOST://0.0.0.0:${KAFKA_PORT_INTERNAL}'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:${KAFKA_PORT_EXTERNAL},PLAINTEXT_HOST://kafka:${KAFKA_PORT_INTERNAL}'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      CLUSTER_ID: ${KAFKA_CLUSTER_ID}
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    networks:
      - food-delivery-network
  
  # ==========================================
  # 3. CONFIG PROCESSOR
  # ==========================================
  config-processor:
    image: alpine:3.18
    container_name: food-delivery-config-processor
    env_file:
      - .env.infra # 🚀 Ép container đọc file .env.infra tại gốc
    volumes:
      - ./:/config
    environment:
      - IDENTITY_SERVICE_PORT=${IDENTITY_SERVICE_PORT}
      - API_GATEWAY_PORT=${API_GATEWAY_PORT}
      - LOKI_PORT=${LOKI_PORT}
      - PROMTAIL_PORT=${PROMTAIL_PORT}
      - PROMETHEUS_PORT=${PROMETHEUS_PORT}
      - GRAFANA_PORT=${GRAFANA_PORT}
    entrypoint:
      - "sh"
      - "-c"
      - |
        apk add --no-cache gettext > /dev/null
        mkdir -p /config/yml-generated/prometheus
        envsubst < /config/development-template/yml-template/prometheus/prometheus.yml.template > /config/yml-generated/prometheus/prometheus.yml
        mkdir -p /config/yml-generated/promtail
        envsubst < /config/development-template/yml-template/promtail/config.yml.template > /config/yml-generated/promtail/config.yml
        mkdir -p /config/yml-generated/loki
        envsubst < /config/development-template/yml-template/loki/local-config.yml.template > /config/yml-generated/loki/local-config.yaml
        mkdir -p /config/yml-generated/grafana/datasources
        envsubst < /config/development-template/yml-template/grafana/datasources.yml.template > /config/yml-generated/grafana/datasources/datasources.yaml
        mkdir -p /config/yml-generated/grafana/dashboards/json
        envsubst < /config/development-template/yml-template/grafana/dashboards.yml.template > /config/yml-generated/grafana/dashboards/dashboards.yaml
        cp /config/grafana-dashboards/services-monitor-dashboard.json /config/yml-generated/grafana/dashboards/json/services-monitor-dashboard.json
        echo "SUCCESS: Đã tạo cây cấu hình chuẩn không cần dùng lệnh command bổ trợ!"
    networks:
      - food-delivery-network
  
  # ==========================================
  # 4. PROMETHEUS SERVER
  # ==========================================
  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: food-delivery-prometheus
    env_file:
      - .env.infra
    ports:
      - "${PROMETHEUS_PORT}:${PROMETHEUS_PORT}"
    volumes:
      - ./yml-generated/prometheus:/etc/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      config-processor:
        condition: service_completed_successfully
    networks:
      - food-delivery-network

  # ==========================================
  # 5. GRAFANA
  # ==========================================
  grafana:
    image: grafana/grafana:10.0.0
    container_name: food-delivery-grafana
    env_file:
      - .env.infra
    ports:
      - "${GRAFANA_PORT}:${GRAFANA_PORT}"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
    volumes:
      - ./yml-generated/grafana:/etc/grafana/provisioning
    depends_on:
      config-processor:
        condition: service_completed_successfully
      prometheus:
        condition: service_started
      loki:
        condition: service_started
    networks:
      - food-delivery-network
  
  # ==========================================
  # 6. LOKI
  # ==========================================
  loki:
    image: grafana/loki:2.8.2
    container_name: food-delivery-loki
    env_file:
      - .env.infra
    ports:
      - "${LOKI_PORT}:${LOKI_PORT}"
    volumes:
      - ./yml-generated/loki:/etc/loki
    environment:
      - LOKI_PORT=${LOKI_PORT}
    depends_on:
      config-processor:
        condition: service_completed_successfully
    networks:
      - food-delivery-network

  # ==========================================
  # 7. PROMTAIL
  # ==========================================
  promtail:
    image: grafana/promtail:2.8.2
    container_name: food-delivery-promtail
    env_file:
      - .env.infra
    volumes:
      - ./yml-generated/promtail:/etc/promtail
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      config-processor:
        condition: service_completed_successfully
      loki:
        condition: service_started
    networks:
      - food-delivery-network

volumes:
  keycloak_data:

networks:
  food-delivery-network:
    name: food-delivery-network
    driver: bridge